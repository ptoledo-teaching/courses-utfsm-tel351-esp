AWSTemplateFormatVersion: '2010-09-09'
Description: 'TEL351 ESP: Assisted Reading. Deploy in us-east-1. Complete the functions, permissions, and triggers described in the lab.'
Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' https://*.execute-api.us-east-1.amazonaws.com https://s3.us-east-1.amazonaws.com https://*.s3.us-east-1.amazonaws.com; media-src https://s3.us-east-1.amazonaws.com https://*.s3.us-east-1.amazonaws.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'
            Override: true
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: TEL351 ESP - Assisted Reading
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: Website
            DomainName:
              Fn::GetAtt:
                - WebsiteBucket
                - RegionalDomainName
            OriginAccessControlId:
              Ref: OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: Website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId:
            Ref: ResponseHeadersPolicy
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - Fn::Sub: ${WebsiteBucket.Arn}/index.html
              - Fn::Sub: ${WebsiteBucket.Arn}/app.js
              - Fn::Sub: ${WebsiteBucket.Arn}/styles.css
              - Fn::Sub: ${WebsiteBucket.Arn}/config.js
            Condition:
              StringEquals:
                AWS:SourceArn:
                  Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt:
                  - WebsiteBucket
                  - Arn
              - Fn::Sub: ${WebsiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - Fn::Sub: https://${WebsiteDistribution.DomainName}
            AllowedMethods:
              - POST
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 300
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt:
                  - DataBucket
                  - Arn
              - Fn::Sub: ${DataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  BootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tel351-esp-bootstrap-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub: ${WebsiteBucket.Arn}/*
  BootstrapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tel351-esp-bootstrap
      Runtime: python3.13
      Handler: index.lambda_handler
      MemorySize: 256
      Timeout: 120
      Role:
        Fn::GetAtt:
          - BootstrapRole
          - Arn
      Code:
        ZipFile: |
          """Self-contained custom resource that publishes files embedded in the template."""
          import base64
          import io
          import json
          import logging
          import urllib.request
          import zipfile
          import zlib

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3 = boto3.client("s3")


          def lambda_handler(event, context):
              physical_id = event.get("PhysicalResourceId", event["LogicalResourceId"])
              status, reason, data = "SUCCESS", "Files published", {}
              try:
                  if event["RequestType"] != "Delete":
                      props = event["ResourceProperties"]
                      files = json.loads(zlib.decompress(base64.b64decode(props["Payload"])))
                      for key, item in files.items():
                          content = item["body"]
                          if props["Kind"] == "code":
                              stream = io.BytesIO()
                              with zipfile.ZipFile(stream, "w", zipfile.ZIP_DEFLATED) as archive:
                                  info = zipfile.ZipInfo("lambda_function.py", date_time=(2026, 1, 1, 0, 0, 0))
                                  info.compress_type = zipfile.ZIP_DEFLATED
                                  archive.writestr(info, content)
                              body = stream.getvalue()
                              data[item["output"]] = key
                          else:
                              body = content.encode("utf-8")
                          s3.put_object(Bucket=props["Bucket"], Key=key, Body=body, ContentType=item["contentType"], CacheControl="no-cache")
                      if props["Kind"] == "website":
                          config = "window.ESP_CONFIG=" + json.dumps({"apiUrl": props["ApiUrl"]}) + ";"
                          s3.put_object(Bucket=props["Bucket"], Key="config.js", Body=config.encode("utf-8"), ContentType="text/javascript", CacheControl="no-store")
                  # Buckets must be emptied manually before deleting the stack.
              except Exception as error:
                  logger.exception("Could not publish the files")
                  status, reason = "FAILED", f"{type(error).__name__}: check CloudWatch Logs"
              reply = json.dumps({"Status": status, "Reason": reason, "PhysicalResourceId": physical_id, "StackId": event["StackId"], "RequestId": event["RequestId"], "LogicalResourceId": event["LogicalResourceId"], "NoEcho": False, "Data": data}).encode("utf-8")
              request = urllib.request.Request(event["ResponseURL"], data=reply, method="PUT", headers={"content-type": "", "content-length": str(len(reply))})
              with urllib.request.urlopen(request, timeout=15) as response:
                  response.read()
    DependsOn:
      - BootstrapLogs
  CodeAssets:
    Type: Custom::ESPFiles
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - BootstrapFunction
          - Arn
      ServiceTimeout: 180
      Kind: code
      Bucket:
        Ref: WebsiteBucket
      Payload: 
  ExtractRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tel351-esp-extract-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  ExtractFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tel351-esp-extract
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      MemorySize: 256
      Timeout: 30
      Role:
        Fn::GetAtt:
          - ExtractRole
          - Arn
      Environment:
        Variables:
          DATA_BUCKET:
            Ref: DataBucket
      Code:
        S3Bucket:
          Ref: WebsiteBucket
        S3Key:
          Fn::GetAtt:
            - CodeAssets
            - ExtractKey
    DependsOn:
      - ExtractLogs
  TranslateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tel351-esp-translate-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  TranslateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tel351-esp-translate
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      MemorySize: 256
      Timeout: 30
      Role:
        Fn::GetAtt:
          - TranslateRole
          - Arn
      Environment:
        Variables:
          DATA_BUCKET:
            Ref: DataBucket
      Code:
        S3Bucket:
          Ref: WebsiteBucket
        S3Key:
          Fn::GetAtt:
            - CodeAssets
            - TranslateKey
    DependsOn:
      - TranslateLogs
  SynthesizeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tel351-esp-synthesize-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  SynthesizeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tel351-esp-synthesize
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      MemorySize: 256
      Timeout: 30
      Role:
        Fn::GetAtt:
          - SynthesizeRole
          - Arn
      Environment:
        Variables:
          DATA_BUCKET:
            Ref: DataBucket
          VOICE_ID: Lupe
      Code:
        S3Bucket:
          Ref: WebsiteBucket
        S3Key:
          Fn::GetAtt:
            - CodeAssets
            - SynthesizeKey
    DependsOn:
      - SynthesizeLogs
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tel351-esp-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub: ${DataBucket.Arn}/uploads/*
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - Fn::Sub: ${DataBucket.Arn}/uploads/*
                  - Fn::Sub: ${DataBucket.Arn}/extracted/*
                  - Fn::Sub: ${DataBucket.Arn}/translated/*
                  - Fn::Sub: ${DataBucket.Arn}/audio/*
                  - Fn::Sub: ${DataBucket.Arn}/errors/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::GetAtt:
                    - DataBucket
                    - Arn
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tel351-esp-api
      Runtime: python3.13
      Handler: index.lambda_handler
      MemorySize: 256
      Timeout: 15
      Role:
        Fn::GetAtt:
          - ApiRole
          - Arn
      Environment:
        Variables:
          DATA_BUCKET:
            Ref: DataBucket
      Code:
        ZipFile: |
          """API auxiliar: carga privada de imágenes y lectura de resultados de una solicitud."""
          import json
          import logging
          import os
          import re
          import uuid

          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          BUCKET = os.environ["DATA_BUCKET"]
          REGION = os.environ.get("AWS_REGION", "us-east-1")
          MAX_UPLOAD_BYTES = 5 * 1024 * 1024
          MAX_DOCUMENT_BYTES = 32 * 1024
          REQUEST_ID = re.compile(r"^[0-9a-f]{32}$")
          s3 = boto3.client("s3", region_name=REGION, endpoint_url=f"https://s3.{REGION}.amazonaws.com", config=Config(signature_version="s3v4", s3={"addressing_style": "virtual"}))
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          def response(status, value):
              return {"statusCode": status, "headers": {"content-type": "application/json; charset=utf-8", "cache-control": "no-store"}, "body": json.dumps(value, ensure_ascii=False)}


          def missing(error):
              return error.response["Error"]["Code"] in {"NoSuchKey", "404", "NotFound"}


          def document(key):
              try:
                  result = s3.get_object(Bucket=BUCKET, Key=key)
              except ClientError as error:
                  if missing(error):
                      return None
                  raise
              body = result["Body"]
              try:
                  if result["ContentLength"] > MAX_DOCUMENT_BYTES:
                      raise ValueError("Documento excede el límite de lectura")
                  value = json.loads(body.read(MAX_DOCUMENT_BYTES + 1))
                  if not isinstance(value, dict):
                      raise ValueError("El resultado no es un objeto JSON")
                  return value
              finally:
                  body.close()


          def exists(key):
              try:
                  return s3.head_object(Bucket=BUCKET, Key=key)
              except ClientError as error:
                  if missing(error):
                      return None
                  raise


          def current_result(request_id):
              result = {"requestId": request_id, "status": "pending", "stage": "upload"}
              if exists(f"uploads/{request_id}.jpg") is None:
                  return result
              result["stage"] = "extract"
              extracted = document(f"extracted/{request_id}.json")
              if extracted is not None:
                  if extracted.get("requestId") != request_id or not isinstance(extracted.get("sourceText"), str):
                      raise ValueError("Contrato de extracción incorrecto")
                  result.update(sourceText=extracted["sourceText"], stage="translate")
              translated = document(f"translated/{request_id}.json")
              if translated is not None:
                  fields = ("sourceText", "sourceLanguage", "targetLanguage", "translatedText")
                  if translated.get("requestId") != request_id or any(not isinstance(translated.get(field), str) for field in fields):
                      raise ValueError("Contrato de traducción incorrecto")
                  result.update({field: translated[field] for field in fields})
                  result["stage"] = "synthesize"
              failure = document(f"errors/{request_id}.json")
              if failure is not None:
                  if failure.get("requestId") != request_id:
                      raise ValueError("Error asociado a otra solicitud")
                  result.update(status="error", stage=failure.get("stage", result["stage"]), error={key: str(failure.get(key, ""))[:500] for key in ("stage", "code", "message")})
                  return result
              audio = exists(f"audio/{request_id}.mp3")
              if audio is not None and extracted is not None and translated is not None:
                  if audio["ContentLength"] == 0 or audio.get("ContentType", "").split(";")[0] != "audio/mpeg":
                      raise ValueError("Audio vacío o con Content-Type incorrecto")
                  result.update(status="complete", stage="complete", audioUrl=s3.generate_presigned_url("get_object", Params={"Bucket": BUCKET, "Key": f"audio/{request_id}.mp3"}, ExpiresIn=300))
              return result


          def lambda_handler(event, context):
              route = event.get("routeKey", "")
              try:
                  if route == "POST /requests":
                      request_id = uuid.uuid4().hex
                      upload = s3.generate_presigned_post(Bucket=BUCKET, Key=f"uploads/{request_id}.jpg", Fields={"Content-Type": "image/jpeg"}, Conditions=[{"Content-Type": "image/jpeg"}, ["content-length-range", 1, MAX_UPLOAD_BYTES]], ExpiresIn=300)
                      logger.info("Solicitud creada: %s", request_id)
                      return response(201, {"requestId": request_id, "upload": upload, "maxUploadBytes": MAX_UPLOAD_BYTES, "expiresIn": 300})
                  if route == "GET /requests/{requestId}":
                      request_id = (event.get("pathParameters") or {}).get("requestId", "")
                      if not REQUEST_ID.fullmatch(request_id):
                          return response(400, {"message": "El identificador de solicitud no es válido."})
                      return response(200, current_result(request_id))
                  return response(404, {"message": "Ruta no encontrada."})
              except (ValueError, UnicodeDecodeError, json.JSONDecodeError):
                  logger.exception("Contrato de resultado inválido")
                  return response(502, {"message": "Un resultado no cumple el contrato esperado. Revise los objetos S3 y los logs de las funciones."})
              except Exception:
                  logger.exception("Error de API auxiliar")
                  return response(500, {"message": "No fue posible consultar la solicitud. Revise CloudWatch Logs."})
    DependsOn:
      - ApiLogs
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: tel351-esp
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - Fn::Sub: https://${WebsiteDistribution.DomainName}
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type
        MaxAge: 300
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::GetAtt:
          - ApiFunction
          - Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000
  CreateRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: POST /requests
      Target:
        Fn::Sub: integrations/${ApiIntegration}
      AuthorizationType: NONE
  GetRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: GET /requests/{requestId}
      Target:
        Fn::Sub: integrations/${ApiIntegration}
      AuthorizationType: NONE
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/requests*
  WebsiteFiles:
    Type: Custom::ESPFiles
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - BootstrapFunction
          - Arn
      ServiceTimeout: 180
      Kind: website
      Bucket:
        Ref: WebsiteBucket
      ApiUrl:
        Fn::GetAtt:
          - HttpApi
          - ApiEndpoint
      Payload: 
  BootstrapLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tel351-esp-bootstrap
      RetentionInDays: 7
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tel351-esp-api
      RetentionInDays: 7
  ExtractLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tel351-esp-extract
      RetentionInDays: 7
  TranslateLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tel351-esp-translate
      RetentionInDays: 7
  SynthesizeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tel351-esp-synthesize
      RetentionInDays: 7
Outputs:
  WebsiteUrl:
    Value:
      Fn::Sub: https://${WebsiteDistribution.DomainName}
    Description: Assisted Reading website
  ApiUrl:
    Value:
      Fn::GetAtt:
        - HttpApi
        - ApiEndpoint
    Description: Application API
  DataBucketName:
    Value:
      Ref: DataBucket
    Description: Images and processing results
  WebsiteBucketName:
    Value:
      Ref: WebsiteBucket
    Description: Website files and starter code
